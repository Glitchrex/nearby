<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>nearby</title>
    <!--
      Only used when GitHub Pages serves the repository root ("Deploy from a branch").
      The recommended setup (Pages source: GitHub Actions) publishes src/ directly.
    -->
    <meta http-equiv="refresh" content="0; url=src/" />
    <script>
      window.location.replace(`src/${window.location.search}`);
    </script>
  </head>
  <body>
    <p><a href="src/">Open nearby</a></p>
  </body>
</html>
